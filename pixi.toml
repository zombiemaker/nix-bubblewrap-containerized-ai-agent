[workspace]
authors = ["ZombieMaker <noemail@nodomain>"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
    "https://repo.prefix.dev/modular-community", 
    "https://repo.prefix.dev/mojo-force", 
    "https://repo.prefix.dev/mojo-community", 
]
name = "x-mojo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]


[feature.mojo.dependencies]
mojo = "==1.0.0"
max = "==26.5"

[feature.mojo.pypi-dependencies]

[feature.max-serve.dependencies]
python = ">=3.14.7,<3.15"
uvicorn = ">=0.52.4,<0.53"
max-pipelines = "==26.5"
pydantic = ">=2.13.5,<3"

[feature.max-serve.pypi-dependencies]
starlette = ">=1.6.0, <2"
fastapi = ">=0.141.1, <0.142"
uvicorn = ">=0.52.4, <0.53"

[feature.python-http-api-server.dependencies]
python-freethreading = ">=3.14.7,<4"
fastapi = ">=0.115.4,<0.116"
strawberry-graphql = ">=0.287.3,<0.288"
uvicorn = ">=0.52.4,<0.53"
pytest = ">=9.1.1,<10"
httpx2 = ">=2.12.0,<3"

[feature.python-http-api-server.pypi-dependencies]

[environments]
mojo-dev = ["mojo"]
max-dev = ["max-serve"]
cpython-dev = ["python-http-api-server"]